<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JobTrack — Job Application Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f9fafb;--white:#fff;--dark:#111827;--border:#e5e7eb;--muted:#9ca3af;--accent:#6366f1;--green:#059669;--yellow:#d97706;--blue:#2563eb;--red:#dc2626;--purple:#7c3aed}
body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;padding:2rem 1rem}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:gap}
h1{font-size:1.8rem;font-weight:800;color:var(--dark)}
.add-btn{background:var(--accent);color:white;border:none;border-radius:10px;padding:10px 20px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:2rem}
.stat{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center}
.stat-num{font-size:1.6rem;font-weight:800;color:var(--dark)}
.stat-lbl{font-size:0.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px}
.filters{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.filter-btn{border:1px solid var(--border);background:var(--white);border-radius:8px;padding:6px 14px;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all 0.15s}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:#eef2ff}
table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden}
thead{background:#f9fafb;border-bottom:1px solid var(--border)}
th{padding:12px 16px;text-align:left;font-size:0.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em}
td{padding:13px 16px;font-size:0.88rem;color:var(--dark);border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:0.75rem;font-weight:700}
.s-applied{background:#eff6ff;color:var(--blue)}
.s-interview{background:#fef9c3;color:var(--yellow)}
.s-offer{background:#ecfdf5;color:var(--green)}
.s-rejected{background:#fef2f2;color:var(--red)}
.s-screening{background:#f5f3ff;color:var(--purple)}
.action-btns{display:flex;gap:6px}
.act{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:0.75rem;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all 0.15s}
.act:hover{border-color:var(--accent);color:var(--accent)}
.act.del:hover{border-color:var(--red);color:var(--red)}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--white);border-radius:16px;padding:2rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal h3{font-weight:800;font-size:1.1rem;margin-bottom:1.5rem;color:var(--dark)}
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.78rem;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--dark);outline:none;background:var(--bg)}
.field input:focus,.field select:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:1.5rem}
.btn-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);padding:9px 18px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-save{background:var(--accent);border:none;color:white;padding:9px 18px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700}
.empty{text-align:center;padding:3rem;color:var(--muted)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.top{gap:1rem}table{font-size:0.8rem}th,td{padding:10px 10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🎯 JobTrack</h1>
    <button class="add-btn" onclick="openModal()">+ Add Application</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="s-all">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-num" id="s-applied">0</div><div class="stat-lbl">Applied</div></div>
    <div class="stat"><div class="stat-num" id="s-interview">0</div><div class="stat-lbl">Interview</div></div>
    <div class="stat"><div class="stat-num" id="s-offer">0</div><div class="stat-lbl">Offers</div></div>
    <div class="stat"><div class="stat-num" id="s-rate">0%</div><div class="stat-lbl">Interview Rate</div></div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('applied',this)">Applied</button>
    <button class="filter-btn" onclick="setFilter('screening',this)">Screening</button>
    <button class="filter-btn" onclick="setFilter('interview',this)">Interview</button>
    <button class="filter-btn" onclick="setFilter('offer',this)">Offer</button>
    <button class="filter-btn" onclick="setFilter('rejected',this)">Rejected</button>
  </div>
  <table>
    <thead><tr><th>Company</th><th>Role</th><th>Status</th><th>Applied</th><th>Salary</th><th>Actions</th></tr></thead>
    <tbody id="appTable"><tr><td colspan="6" class="empty">No applications yet — add your first one!</td></tr></tbody>
  </table>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Add Application</h3>
    <div class="field"><label>Company Name</label><input id="mCompany" placeholder="e.g. Google"/></div>
    <div class="field"><label>Job Role</label><input id="mRole" placeholder="e.g. Software Engineer"/></div>
    <div class="field"><label>Status</label>
      <select id="mStatus">
        <option value="applied">Applied</option><option value="screening">Screening</option>
        <option value="interview">Interview</option><option value="offer">Offer</option><option value="rejected">Rejected</option>
      </select>
    </div>
    <div class="field"><label>Date Applied</label><input type="date" id="mDate"/></div>
    <div class="field"><label>Salary Range (₹ LPA)</label><input id="mSalary" placeholder="e.g. 8-12 LPA"/></div>
    <div class="field"><label>Job URL</label><input id="mUrl" placeholder="https://..."/></div>
    <div class="field"><label>Notes</label><textarea id="mNotes" placeholder="Recruiter contact, notes..." style="min-height:70px;resize:none"></textarea></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveApp()">Save</button>
    </div>
  </div>
</div>
<script>
let apps=JSON.parse(localStorage.getItem('jobtrack-apps')||'[]');
let filterStatus='all', editId=null;
function save(){localStorage.setItem('jobtrack-apps',JSON.stringify(apps));}
function openModal(id=null){
  editId=id;
  document.getElementById('modalTitle').textContent=id?'Edit Application':'Add Application';
  if(id){const a=apps.find(a=>a.id===id);if(a){document.getElementById('mCompany').value=a.company;document.getElementById('mRole').value=a.role;document.getElementById('mStatus').value=a.status;document.getElementById('mDate').value=a.date;document.getElementById('mSalary').value=a.salary;document.getElementById('mUrl').value=a.url;document.getElementById('mNotes').value=a.notes;}}
  else{['mCompany','mRole','mSalary','mUrl','mNotes'].forEach(f=>document.getElementById(f).value='');document.getElementById('mDate').value=new Date().toISOString().split('T')[0];document.getElementById('mStatus').value='applied';}
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');editId=null;}
function saveApp(){
  const company=document.getElementById('mCompany').value.trim();
  const role=document.getElementById('mRole').value.trim();
  if(!company||!role){alert('Company and role are required');return;}
  const app={id:editId||Date.now().toString(),company,role,status:document.getElementById('mStatus').value,date:document.getElementById('mDate').value,salary:document.getElementById('mSalary').value,url:document.getElementById('mUrl').value,notes:document.getElementById('mNotes').value};
  if(editId){const idx=apps.findIndex(a=>a.id===editId);apps[idx]=app;}else apps.unshift(app);
  save();render();closeModal();
}
function deleteApp(id){if(confirm('Delete this application?')){apps=apps.filter(a=>a.id!==id);save();render();}}
function setFilter(f,btn){filterStatus=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function render(){
  const statusClass={applied:'s-applied',screening:'s-screening',interview:'s-interview',offer:'s-offer',rejected:'s-rejected'};
  const filtered=filterStatus==='all'?apps:apps.filter(a=>a.status===filterStatus);
  const tbody=document.getElementById('appTable');
  if(!filtered.length){tbody.innerHTML=`<tr><td colspan="6" class="empty">No ${filterStatus==='all'?'':filterStatus+' '}applications yet</td></tr>`;return;}
  tbody.innerHTML=filtered.map(a=>`
    <tr>
      <td><strong>${a.company}</strong></td>
      <td>${a.role}</td>
      <td><span class="badge ${statusClass[a.status]||'s-applied'}">${a.status.charAt(0).toUpperCase()+a.status.slice(1)}</span></td>
      <td>${a.date||'—'}</td>
      <td>${a.salary||'—'}</td>
      <td><div class="action-btns">
        <button class="act" onclick="openModal('${a.id}')">Edit</button>
        ${a.url?`<button class="act" onclick="window.open('${a.url}')">Open</button>`:''}
        <button class="act del" onclick="deleteApp('${a.id}')">Delete</button>
      </div></td>
    </tr>`).join('');
  // Stats
  document.getElementById('s-all').textContent=apps.length;
  document.getElementById('s-applied').textContent=apps.filter(a=>a.status==='applied').length;
  document.getElementById('s-interview').textContent=apps.filter(a=>a.status==='interview').length;
  document.getElementById('s-offer').textContent=apps.filter(a=>a.status==='offer').length;
  const interviews=apps.filter(a=>['interview','offer'].includes(a.status)).length;
  document.getElementById('s-rate').textContent=apps.length?`${Math.round(interviews/apps.length*100)}%`:'0%';
}
// Seed data
if(apps.length===0){
  apps=[
    {id:'1',company:'Razorpay',role:'Backend Engineer',status:'interview',date:'2025-03-28',salary:'18-24 LPA',url:'',notes:'2nd round scheduled'},
    {id:'2',company:'Zomato',role:'SDE-1',status:'applied',date:'2025-04-01',salary:'12-16 LPA',url:'',notes:''},
    {id:'3',company:'CRED',role:'Python Developer',status:'screening',date:'2025-04-03',salary:'15-20 LPA',url:'',notes:'HR call done'},
    {id:'4',company:'Groww',role:'Full Stack Developer',status:'rejected',date:'2025-03-20',salary:'10-14 LPA',url:'',notes:''},
    {id:'5',company:'Zepto',role:'Software Engineer',status:'applied',date:'2025-04-05',salary:'12-18 LPA',url:'',notes:'Referral from LinkedIn'},
  ];
  save();
}
render();
</script>
</body>
</html>
